[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attackpath"
version = "0.1.0"
description = "AI-assisted attack path prioritization from Nmap scans"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["networkx", "jinja2", "scikit-learn"]

[project.scripts]
attackpath = "attackpath.cli:main"

[tool.setuptools]
packages = ["attackpath"]
